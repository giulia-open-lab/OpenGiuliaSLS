# Giulia reference Conda environment.
#
# Exact snapshot (versions, full transitive closure) of the validated
# reference environment "giulia-no-tf" (Python 3.11.15, Linux x86_64),
# exported on 2026-07-13 with `conda env export --no-builds`.
#
# The curated list of direct dependencies is hardcoded (pinned) in
# scripts/installer.sh and scripts/installer_dependencies.sh; this file is what
# Docker (see Dockerfile) and `conda env create` use to reproduce the
# environment bit-for-bit.
#
# Usage: conda env create -f environment.yml [-n <name>]
